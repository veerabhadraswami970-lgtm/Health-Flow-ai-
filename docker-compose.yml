version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthflow_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - PERSISTENCE_MODE=local
      - USE_MOCK_INTEGRATIONS=True
    volumes:
      - ./backend/data_store:/app/data_store
      - ./backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: healthflow_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
